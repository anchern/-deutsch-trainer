name: Check trainer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- sw.js
      - uses: actions/upload-artifact@v4
        with:
          name: deutsch-trainer-static
          path: dist
